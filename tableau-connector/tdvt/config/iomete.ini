[Datasource]
Name = iomete
LogicalQueryFormat = iomete
SchemaName = __IOMETE_SCHEMA__
CommandLineOverride = -DConnectPluginsPath=__CONNECTOR_ROOT__

[LogicalConfig]
Name = iomete
tablename = $dsName
tablenameLower = True
tablePrefix = [__IOMETE_SCHEMA__].

[StandardTests]
# Excluded: Spark 3.x has no TIME type, 
# so Calcs.time1 is a STRING rather than the TIME value TDVT expects. 
# No customer impact since IOMETE cannot expose TIME columns.
ExpressionExclusions_Standard = calcs_data.time

[LODTests]

[UnionTest]

[StaplesDataTest]

[ConnectionTests]
StaplesTestEnabled = True
CastCalcsTestEnabled = True
