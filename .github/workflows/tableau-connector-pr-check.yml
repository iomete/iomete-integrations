name: PR Check for tableau-connector

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tableau-connector/**'
      - '.github/workflows/tableau-connector-pr-check.yml'
  workflow_call:

defaults:
  run:
    working-directory: tableau-connector

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Run contract tests
        run: node --test tests/*.test.js

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Cache the Connector SDK and packager venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/iomete-tableau-connector
          key: taco-sdk-${{ hashFiles('tableau-connector/scripts/taco.sh') }}

      - name: Validate connector XML
        run: ./scripts/taco.sh validate
